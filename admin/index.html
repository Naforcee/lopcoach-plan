<style>
:root {
  --bg: #F3F3F0; --surface: #FFFFFF; --surface-2: #F1F2F4; --surface-3: #E8E9EC; --text: #15171A; --text-2: #5A5D63;
  --line: #E3E3DF; --outline: #7D828A; --primary: #1F5FAE; --on-primary: #FFFFFF; --primary-container: #EEF4FD; --on-primary-container: #0C2E5E;
  --planned: #D6E5F8; --planned-edge: #5E95DB; --done: #255FAE; --track: #E6E6E2; --neutral: #6E737B;
  --sel: #E3E8F0; --on-sel: #1D2633; --sel-line: #4F5B6B;
  --good: #2E9E4F; --warning: #F2B01E; --critical: #D93F3F;

  --good-container: #E2F4E7; --on-good-container: #145C2C; --warning-container: #FFF1D1; --on-warning-container: #8F5B00;
  --critical-container: #FDE4E2; --on-critical-container: #7A1F1A;
  --accent: #E8622C; --accent-text: #B4461A; --accent-container: #FFE3D6; --on-accent-container: #8A3210;
  --hero: #FFFFFF; --hero-shadow: 0 1px 3px rgba(21, 23, 26, 0.12), 0 1px 1px rgba(21, 23, 26, 0.06);
  --z1: #5E95DB; --z2: #3B78C9; --z3: #255FAE; --z4: #18478A; --z5: #0B2C5C;
  --fs-xs: 0.75rem; --fs-sm: 0.8125rem; --fs-base: 0.9375rem; --fs-md: 1.0625rem;
  --fs-lg: clamp(1.1875rem, 1.1rem + 0.45vw, 1.4375rem); --fs-xl: clamp(1.625rem, 1.35rem + 1.4vw, 2.25rem);
  --sp-1: 0.25rem; --sp-2: 0.5rem; --sp-3: 0.75rem; --sp-4: 1rem; --sp-5: 1.5rem; --sp-6: 2rem; --sp-7: 2.75rem;
  --radius: 16px; --radius-sm: 12px; --nav-h: 64px;
  color-scheme: light;
}
@media screen and (prefers-color-scheme: dark) {
  :root {
    --bg: #0F1012; --surface: #1B1C1F; --surface-2: #25272B; --surface-3: #2E3034; --text: #ECEDEF; --text-2: #A9ADB4;
    --line: #2E3034; --outline: #7A7F88; --primary: #8DB8F2; --on-primary: #0B2A52; --primary-container: #18283D; --on-primary-container: #D6E6FA;
    --planned: #2A3A52; --planned-edge: #3D6DB0; --done: #80AAE8; --track: #34363B; --neutral: #9AA0A8;
    --sel: #2B323D; --on-sel: #DDE3EC; --sel-line: #B8C3D2;
    --good: #63C98A; --warning: #F5C451; --critical: #FF8F87;
    --good-text: #63C98A; --warning-text: #F5C451; --critical-text: #FF8F87;
    --good-container: #26362F; --on-good-container: #63C98A; --warning-container: #3C3526; --on-warning-container: #F5C451;
    --critical-container: #3D2D2F; --on-critical-container: #FF8F87;
    --accent: #FF8A5C; --accent-text: #FF8A5C; --accent-container: #4A2210; --on-accent-container: #FFD9C8;
    --hero: #15202F; --hero-shadow: none;
    --z1: #3D6DB0; --z2: #5A8BD3; --z3: #80AAE8; --z4: #AECBF3; --z5: #E6F0FD;
    color-scheme: dark;
  }
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: var(--fs-base); line-height: 1.5; -webkit-font-smoothing: antialiased; overflow-wrap: break-word; }
h1 { font-size: var(--fs-xl); line-height: 1.15; letter-spacing: -0.02em; margin: 0 0 var(--sp-2); font-weight: 700; }
h2 { font-size: var(--fs-lg); line-height: 1.25; letter-spacing: -0.01em; font-weight: 650; margin: var(--sp-6) 0 var(--sp-3); }
h3 { font-size: 1.125rem; line-height: 1.3; font-weight: 650; margin: 0 0 var(--sp-2); }
h4 { font-size: var(--fs-base); font-weight: 650; margin: var(--sp-3) 0 var(--sp-2); }
p { margin: 0 0 var(--sp-3); }
a { color: var(--primary); }
.muted { color: var(--text-2); }
.small { font-size: var(--fs-sm); }
.xs { font-size: var(--fs-xs); }
.strong { font-weight: 650; }
.num, table, .tile-value, .day-km, .tick { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; border-radius: 6px; }

/* Shell */
.top { position: sticky; top: 0; z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1120px; margin: 0 auto; padding: var(--sp-2) var(--sp-4); display: flex; align-items: center; gap: var(--sp-3); min-height: 56px; }
.brand { font-weight: 700; font-size: var(--fs-md); margin: 0; display: flex; align-items: center; gap: var(--sp-2); white-space: nowrap; }
.brand-mark { width: 22px; height: 22px; border-radius: 7px; background: var(--accent); display: inline-block; position: relative; flex: none; }
.brand-mark::after { content: ""; position: absolute; left: 6px; top: 5px; width: 10px; height: 12px; border-left: 3px solid var(--hero); border-bottom: 3px solid var(--hero); transform: skewX(-14deg); }
.fresh { font-size: var(--fs-xs); color: var(--text-2); margin: 0 0 0 auto; text-align: right; line-height: 1.3; }
main { max-width: 1120px; margin: 0 auto; padding: var(--sp-4) var(--sp-4) calc(var(--nav-h) + 96px + env(safe-area-inset-bottom)); }
.screen { max-width: 760px; margin: 0 auto; }
.screen.wide { max-width: 1120px; }
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(5, 1fr); padding: 0 0 env(safe-area-inset-bottom); }
.tab { appearance: none; border: 0; background: none; color: var(--text-2); font: inherit; font-size: var(--fs-xs); min-height: var(--nav-h); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer; padding: 6px 2px; }
.tab svg { width: 40px; height: 26px; padding: 2px 9px; border-radius: 13px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tab[aria-current="page"] { color: var(--text); font-weight: 650; }
.tab[aria-current="page"] svg { background: var(--sel); color: var(--on-sel); }
@media (min-width: 900px) {
  nav.tabs { position: static; display: flex; border: 0; background: none; padding: 0; gap: var(--sp-1); }
  .tab { flex-direction: row; min-height: 44px; font-size: var(--fs-sm); padding: 0 var(--sp-3); border-radius: 999px; gap: var(--sp-1); }
  .tab svg { width: 20px; height: 20px; padding: 0; background: none !important; }
  .tab[aria-current="page"] { background: var(--sel); color: var(--on-sel); }
  main { padding-bottom: 120px; }
  .fresh { margin-left: var(--sp-3); }
  .top-in { gap: var(--sp-4); }
}

/* Parts */
.card { background: var(--surface); border-radius: var(--radius); padding: clamp(1rem, 0.8rem + 1vw, 1.375rem); margin: 0 0 var(--sp-3); }
.hero { background: var(--hero); box-shadow: var(--hero-shadow); }
.label { font-size: var(--fs-sm); color: var(--text-2); font-weight: 600; margin: 0 0 var(--sp-1); }
.kicker { color: var(--accent-text); font-weight: 650; font-size: var(--fs-sm); margin: 0 0 var(--sp-1); }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(9.5rem, 1fr)); gap: var(--sp-3); margin: 0 0 var(--sp-3); }
.tiles > .card { margin: 0; }
.tile-value { font-size: 1.625rem; font-weight: 700; line-height: 1.2; margin: 0; }
.tile-unit { font-size: var(--fs-sm); color: var(--text-2); font-weight: 500; }
.tile-sub { font-size: var(--fs-sm); color: var(--text-2); margin: var(--sp-1) 0 0; }
.trio { display: grid; grid-template-columns: repeat(3, auto); justify-content: start; gap: 0 var(--sp-4); }
.trio p { margin: 0; }
.trio-v { font-size: 1.375rem; font-weight: 700; line-height: 1.2; font-variant-numeric: tabular-nums; }
.trio-k { font-size: var(--fs-xs); color: var(--text-2); }
.grid2 { display: grid; gap: var(--sp-3); }
.grid2 > * { min-width: 0; }
@media (min-width: 900px) { .grid2 { grid-template-columns: 1fr 1fr; align-items: start; } .grid2 > .card { margin: 0; } }
.pill { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 2px var(--sp-3); font-size: var(--fs-sm); font-weight: 600; white-space: nowrap; background: var(--surface-2); color: var(--text-2); }
.pill.good { background: var(--good-container); color: var(--on-good-container); }
.pill.warning { background: var(--warning-container); color: var(--on-warning-container); }
.pill.critical { background: var(--critical-container); color: var(--on-critical-container); }
.pill.accent { background: var(--accent-container); color: var(--on-accent-container); }
.pill.info { background: var(--sel); color: var(--on-sel); }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
.dot.good { background: var(--good); } .dot.warning { background: var(--warning); } .dot.critical { background: var(--critical); }
.banner { display: flex; gap: var(--sp-3); align-items: flex-start; background: var(--surface); border-radius: var(--radius-sm); padding: var(--sp-3) var(--sp-4); margin: 0 0 var(--sp-3); border-left: 4px solid var(--sel-line); }
.banner.warning { border-left-color: var(--warning); } .banner.critical { border-left-color: var(--critical); } .banner.good { border-left-color: var(--good); }
.banner p { margin: 0; }
.banner .grow { flex: 1; min-width: 0; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-2); }
.row.between { justify-content: space-between; }
.stack > * + * { margin-top: var(--sp-3); }
.btn { appearance: none; border: 0; font: inherit; font-weight: 600; font-size: var(--fs-base); min-height: 44px; padding: 0 var(--sp-4); border-radius: 999px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: var(--sp-2); background: var(--primary); color: var(--on-primary); text-decoration: none; }
.btn.tonal { background: var(--sel); color: var(--on-sel); }
.btn.text { background: none; color: var(--primary); padding: 0 var(--sp-3); }
.btn.danger { background: var(--critical-container); color: var(--on-critical-container); }
.btn.small { min-height: 44px; font-size: var(--fs-sm); padding: 0 var(--sp-3); }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn.block { width: 100%; }
.chips { display: flex; flex-wrap: wrap; gap: var(--sp-2); margin: 0 0 var(--sp-3); }
.chip { appearance: none; font: inherit; font-size: var(--fs-sm); min-height: 44px; padding: 0 var(--sp-3); border-radius: 12px; border: 1px solid var(--outline); background: var(--surface); color: var(--text); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; text-align: left; }
.chip[aria-pressed="true"] { background: var(--sel); color: var(--on-sel); border-color: var(--sel-line); font-weight: 650; }
.chip[aria-pressed="true"]::before { content: ""; width: 10px; height: 6px; border-left: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: rotate(-45deg) translate(1px, -2px); flex: none; }
.chip .sub { display: block; font-size: var(--fs-xs); color: var(--text-2); font-weight: 400; }
.chip.warn { border-style: dashed; }
.field { display: flex; flex-direction: column; gap: 4px; margin: 0 0 var(--sp-3); }
.field > span { font-size: var(--fs-sm); font-weight: 600; }
.field .hint { font-size: var(--fs-xs); color: var(--text-2); font-weight: 400; }
input[type=text], input[type=password], input[type=number], input[type=date], input[type=time], select { font: inherit; font-size: 1rem; min-height: 44px; padding: 0 var(--sp-3); border-radius: 10px; border: 1px solid var(--outline); background: var(--surface); color: var(--text); width: 100%; max-width: 100%; }
input:focus-visible, select:focus-visible { outline: 2px solid var(--primary); outline-offset: 0; }
.check { display: flex; align-items: center; gap: var(--sp-2); min-height: 44px; font-size: var(--fs-base); }
.check input { width: 22px; height: 22px; accent-color: var(--primary); }
.err { color: var(--critical-text); font-weight: 600; font-size: var(--fs-sm); margin: 0 0 var(--sp-3); }
.ok { color: var(--good-text); font-weight: 600; font-size: var(--fs-sm); }
.formrow { display: grid; gap: 0 var(--sp-3); grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr)); }
.list { list-style: none; padding: 0; margin: 0; }
.list > li { border-top: 1px solid var(--line); padding: var(--sp-3) 0; }
.list > li:first-child { border-top: 0; }
.linkrow { appearance: none; background: none; border: 0; font: inherit; color: var(--text); width: 100%; text-align: left; min-height: 56px; display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3); cursor: pointer; padding: var(--sp-2) 0; border-top: 1px solid var(--line); }
.linkrow:first-of-type { border-top: 0; }
.linkrow::after { content: ""; width: 8px; height: 8px; border-right: 2px solid var(--text-2); border-bottom: 2px solid var(--text-2); transform: rotate(-45deg); flex: none; margin-right: 4px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 2px var(--sp-4); margin: 0; font-size: var(--fs-sm); }
.kv dt { color: var(--text-2); } .kv dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; }
.bar { height: 8px; border-radius: 4px; background: var(--track); position: relative; overflow: hidden; margin: var(--sp-2) 0; }
.bar > span { position: absolute; left: 0; top: 0; bottom: 0; background: var(--done); border-radius: 4px; }
.steps { list-style: none; padding: 0; margin: var(--sp-2) 0 0; font-size: var(--fs-sm); }
.steps li { padding: 2px 0 2px var(--sp-3); border-left: 3px solid var(--planned-edge); margin: 0 0 4px; }
.steps li.work { border-left-color: var(--z4); font-weight: 600; }
.note { background: var(--surface-2); border-radius: var(--radius-sm); padding: var(--sp-3) var(--sp-4); font-size: var(--fs-sm); color: var(--text-2); }
details.more > summary { cursor: pointer; min-height: 44px; display: flex; align-items: center; font-weight: 600; color: var(--primary); }

/* Gate */
.gate { max-width: 460px; margin: 6vh auto 0; padding: 0 var(--sp-4) var(--sp-7); }
.gate .card { padding: var(--sp-5); }
.gate h1 { font-size: 1.75rem; }

/* Plan */
.week { background: var(--surface); border-radius: var(--radius); margin: 0 0 var(--sp-3); overflow: hidden; }
.week > summary { list-style: none; cursor: pointer; padding: var(--sp-3) var(--sp-4); min-height: 56px; display: flex; flex-wrap: wrap; align-items: center; gap: 2px var(--sp-3); }
.week > summary::-webkit-details-marker { display: none; }
.week > summary::after { content: ""; width: 8px; height: 8px; margin-left: auto; border-right: 2px solid var(--text-2); border-bottom: 2px solid var(--text-2); transform: rotate(45deg); flex: none; }
.week[open] > summary::after { transform: rotate(-135deg); }
.week-title { font-weight: 650; }
.week-meta { font-size: var(--fs-sm); color: var(--text-2); }
.week.now { box-shadow: inset 4px 0 0 var(--accent); }
.days { list-style: none; margin: 0; padding: 0 0 var(--sp-2); }
.day { display: grid; grid-template-columns: 44px minmax(0, 1fr); align-items: stretch; border-top: 1px solid var(--line); position: relative; }
.day.today { background: linear-gradient(90deg, var(--accent-container), transparent 55%); }
.day-handle { appearance: none; border: 0; background: none; color: var(--text-2); width: 44px; min-height: 56px; cursor: grab; touch-action: none; display: flex; align-items: center; justify-content: center; padding: 0; }
.day-handle svg { width: 16px; height: 22px; fill: currentColor; }
.day-handle:disabled { cursor: default; opacity: 0; }
.day-main { appearance: none; border: 0; background: none; font: inherit; color: inherit; text-align: left; width: 100%; min-height: 56px; padding: var(--sp-2) var(--sp-4) var(--sp-2) 0; display: grid; grid-template-columns: 3.6rem minmax(0, 1fr) auto; gap: 2px var(--sp-3); align-items: baseline; cursor: pointer; }
.day-main:disabled { cursor: default; color: inherit; }
.day-date { font-size: var(--fs-sm); color: var(--text-2); }
.day.today .day-date { color: var(--accent-text); font-weight: 700; }
.day-what { min-width: 0; }
.day-type { font-weight: 600; hyphens: auto; }
.day.rest .day-type { font-weight: 400; color: var(--text-2); }
.day-pace { display: block; font-size: var(--fs-sm); color: var(--text-2); }
.day-km { font-weight: 650; white-space: nowrap; text-align: right; }
.marks { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.mark { font-size: var(--fs-xs); border-radius: 999px; padding: 0 var(--sp-2); background: var(--surface-2); color: var(--text-2); white-space: nowrap; font-weight: 600; }
.mark.changed { background: var(--sel); color: var(--on-sel); }
.mark.draft { background: var(--accent-container); color: var(--on-accent-container); }
.mark.done { background: var(--good-container); color: var(--on-good-container); }
.mark.miss { background: var(--critical-container); color: var(--on-critical-container); }
.day.past .day-main { opacity: 0.85; }
.day.drop-ok { background: var(--primary-container); }
.day.drop-ok::after { content: ""; position: absolute; inset: 2px; border: 2px dashed var(--primary); border-radius: 10px; pointer-events: none; }
.day.drop-over { background: var(--sel); }
.day.drop-over::after { border-style: solid; }
.day.drop-no { opacity: 0.45; }
.day.dragging { opacity: 0.5; }
.ghost { position: fixed; left: 0; top: 0; z-index: 60; pointer-events: none; background: var(--hero); box-shadow: 0 6px 24px rgba(0,0,0,0.25); border-radius: 12px; padding: var(--sp-2) var(--sp-3); font-weight: 650; font-size: var(--fs-sm); max-width: 70vw; }
.legend { list-style: none; padding: 0; margin: 0 0 var(--sp-2); display: flex; flex-wrap: wrap; gap: var(--sp-1) var(--sp-4); font-size: var(--fs-sm); color: var(--text-2); }
.legend li { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
@media (min-width: 900px) {
  .week[open] .days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; padding: 0 var(--sp-3) var(--sp-3); }
  .week[open] .day { grid-template-columns: 1fr; grid-template-rows: auto 1fr; border: 1px solid var(--line); border-radius: 12px; min-height: 9rem; }
  .week[open] .day-handle { width: 100%; min-height: 28px; justify-content: flex-end; padding-right: 8px; position: absolute; top: 0; right: 0; width: 44px; height: 44px; }
  .week[open] .day-main { grid-template-columns: 1fr; padding: var(--sp-2) var(--sp-3); align-content: start; align-items: start; }
  .week[open] .day-km { text-align: left; }
}

/* Dialog */
dialog.sheet { border: 0; padding: 0; background: var(--surface); color: var(--text); width: 100%; max-width: 560px; max-height: 92vh; border-radius: 20px 20px 0 0; margin: auto auto 0; overflow: auto; }
dialog.sheet::backdrop { background: rgba(0, 0, 0, 0.45); }
@media (min-width: 700px) { dialog.sheet { border-radius: 20px; margin: auto; } }
.sheet-in { padding: var(--sp-4) var(--sp-4) calc(var(--sp-5) + env(safe-area-inset-bottom)); }
.sheet-head { display: flex; align-items: flex-start; gap: var(--sp-3); margin: 0 0 var(--sp-3); }
.sheet-head h2 { margin: 0; flex: 1; }
.close { appearance: none; border: 0; background: var(--surface-2); color: var(--text); width: 44px; height: 44px; border-radius: 50%; cursor: pointer; font-size: 1.25rem; line-height: 1; flex: none; }
.section { border-top: 1px solid var(--line); padding: var(--sp-3) 0 var(--sp-1); }

/* Draft bar */
.draftbar { position: fixed; z-index: 25; left: var(--sp-3); right: var(--sp-3); bottom: calc(var(--nav-h) + var(--sp-2) + env(safe-area-inset-bottom)); max-width: 720px; margin: 0 auto; background: var(--hero); box-shadow: 0 4px 18px rgba(0, 0, 0, 0.18); border-radius: var(--radius); padding: var(--sp-2) var(--sp-2) var(--sp-2) var(--sp-4); display: flex; align-items: center; gap: var(--sp-2); flex-wrap: wrap; }
.draftbar .grow { flex: 1; min-width: 8rem; font-weight: 650; font-size: var(--fs-sm); }
@media (min-width: 900px) { .draftbar { bottom: var(--sp-4); } }
.toast { position: fixed; z-index: 70; left: 50%; transform: translateX(-50%); bottom: calc(var(--nav-h) + 84px); background: var(--text); color: var(--bg); padding: var(--sp-2) var(--sp-4); border-radius: 999px; font-size: var(--fs-sm); font-weight: 600; max-width: calc(100vw - 32px); text-align: center; }

(() => {

  const WARNING = { load_high: 'Hög belastning', load_very_high: 'Mycket hög belastning', volume_jump: 'Snabb volymökning' };
  const STATUS = { peaking: 'Toppar formen', strained: 'Ansträngd', detraining: 'Tappar form', productive: 'Produktiv', unproductive: 'Improduktiv', maintaining: 'Bibehåller', unknown: 'Okänd' };
  const OUTLOOK = { on_track: ['I fas mot målet', 'good'], within_reach: ['Inom räckhåll', 'warning'], behind: ['Efter målet', 'critical'], unknown: ['Okänt läge', ''] };
  const EFFORT = { light: 'Lätt', moderate: 'Normal', hard: 'Hård', very_hard: 'Mycket hård' };
  const FOCUS = { recovery: 'återhämtning', base: 'bas', tempo: 'tempo', threshold: 'tröskel', max: 'max' };
  const DAY_STATUS = { done: ['Gjort', 'done'], shorter: ['Kortare', ''], longer: ['Längre', ''], easier: ['Lättare', ''], missed: ['Missat', 'miss'], extra: ['Extra', ''], rest: ['Vila', ''], today: ['Idag', ''], upcoming: ['Kommande', ''] };
  const OP_STATUS = { applied: ['Gjord', 'good'], rejected: ['Avvisad', 'critical'], partly: ['Delvis', 'warning'], skipped: ['Inte gjord', 'warning'] };
  const PRIORITY = { A: 'A-lopp', B: 'B-lopp', C: 'C-lopp' };

  /* ---------- State ---------- */
  let S = blank();
  function blank() {
    return { key: null, repo: null, token: null, data: null, loadedAt: 0, draft: [], history: [], route: 'oversikt', lastActive: Date.now(), polling: null, error: null, notice: null, sending: false };
  }

  /* ---------- DOM helpers (text only, never markup from data) ---------- */
  const $ = (id) => document.getElementById(id);
  function el(tag, attrs, ...kids) {
    const e = document.createElement(tag);
    setAttrs(e, attrs);
    add(e, kids);
    return e;
  }
  const SVGNS = 'http://www.w3.org/2000/svg';
  function sv(tag, attrs, ...kids) {
    const e = document.createElementNS(SVGNS, tag);
    setAttrs(e, attrs);
    add(e, kids);
    return e;
  }
  function setAttrs(e, attrs) {
    if (!attrs) return;
    for (const k of Object.keys(attrs)) {
      const v = attrs[k];
      if (v === null || v === undefined || v === false) continue;
      if (k === 'text') e.textContent = String(v);
      else if (k === 'class') e.setAttribute('class', v);
      else if (k.startsWith('on') && typeof v === 'function') e.addEventListener(k.slice(2), v);
      else if (k === 'value') e.value = v;
      else if (k === 'checked') e.checked = !!v;
      else e.setAttribute(k, v === true ? '' : String(v));
    }
  }
  function add(e, kids) {
    for (const k of kids) {
      if (k === null || k === undefined || k === false) continue;
      if (Array.isArray(k)) add(e, k);
      else if (k instanceof Node) e.appendChild(k);
      else e.appendChild(document.createTextNode(String(k)));
    }
  }
  function clear(e) { while (e.firstChild) e.removeChild(e.firstChild); return e; }

  /* ---------- Value guards ---------- */
  const arr = (x) => (Array.isArray(x) ? x : []);
  const obj = (x) => (x && typeof x === 'object' && !Array.isArray(x) ? x : {});
  const num = (x) => (typeof x === 'number' && isFinite(x) ? x : null);
  const str = (x) => (typeof x === 'string' ? x : null);
  const isDate = (x) => typeof x === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(x);

  /* ---------- Formatting (Swedish) ---------- */
  const MINUS = '−';
  const NB = ' ';
  function nf(x, d) {
    if (num(x) === null) return '–';
    const s = Math.abs(x).toFixed(d === undefined ? 1 : d).replace('.', ',');
    return (x < 0 && Number(s.replace(',', '.')) !== 0 ? MINUS : '') + s;
  }
  function signed(x, d) { if (num(x) === null) return '–'; return (x > 0 ? '+' : '') + nf(x, d); }
  function km(x) {
    if (num(x) === null) return '';
    const r = Math.round(x * 10) / 10;
    return (Number.isInteger(r) ? String(r) : nf(r, 1)) + NB + 'km';
  }
  function kmNum(x) { const r = Math.round(x * 10) / 10; return Number.isInteger(r) ? String(r) : nf(r, 1); }
  function paceText(s) {
    if (num(s) === null) return '';
    const t = Math.round(s);
    return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0');
  }
  function pace(s) { return paceText(s) + NB + '/km'; }
  function hms(sec) {
    if (num(sec) === null) return '–';
    const t = Math.round(sec);
    const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60;
    return h > 0 ? h + ':' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0') : m + ':' + String(s).padStart(2, '0');
  }
  function parseTime(text) {
    const parts = String(text || '').trim().split(':');
    if (parts.length < 2 || parts.length > 3 || parts.some((p) => !/^\d{1,3}$/.test(p))) return null;
    const n = parts.map(Number);
    const [h, m, s] = n.length === 3 ? n : [0, n[0], n[1]];
    if (s > 59 || (n.length === 3 && m > 59)) return null;
    const total = h * 3600 + m * 60 + s;
    return total > 0 ? total : null;
  }
  function minutesText(min) {
    if (num(min) === null) return '–';
    const t = Math.round(min);
    const h = Math.floor(t / 60), m = t % 60;
    return h > 0 ? h + NB + 'h ' + m + NB + 'min' : m + NB + 'min';
  }
  function decimal(t) { const v = Number(String(t || '').trim().replace(/\s/g, '').replace(',', '.')); return String(t || '').trim() && isFinite(v) ? v : NaN; }
  function plural(n, one, many) { return n + NB + (n === 1 ? one : many); }

  /* ---------- Dates: ISO calendar days, Europe/Stockholm ---------- */
  function parseDay(iso) { const [y, m, d] = iso.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)); }
  function isoOf(dt) { return dt.toISOString().slice(0, 10); }
  function addDays(iso, n) { const d = parseDay(iso); d.setUTCDate(d.getUTCDate() + n); return isoOf(d); }
  function dow(iso) { return (parseDay(iso).getUTCDay() + 6) % 7; }
  function mondayOf(iso) { return addDays(iso, -dow(iso)); }
  function daysBetween(a, b) { return Math.round((parseDay(b) - parseDay(a)) / 86400000); }
  function isoWeek(iso) {
    const d = parseDay(iso);
    d.setUTCDate(d.getUTCDate() + 3 - ((d.getUTCDay() + 6) % 7));
    const jan4 = new Date(Date.UTC(d.getUTCFullYear(), 0, 4));
    return 1 + Math.round(((d - jan4) / 86400000 - 3 + ((jan4.getUTCDay() + 6) % 7)) / 7);
  }
  function dayText(iso) { const d = parseDay(iso); return WD_SHORT[dow(iso)] + ' ' + d.getUTCDate() + ' ' + MONTHS[d.getUTCMonth()]; }
  function dateText(iso) { const d = parseDay(iso); return d.getUTCDate() + ' ' + MONTHS[d.getUTCMonth()] + ' ' + d.getUTCFullYear(); }
  function shortDate(iso) { const d = parseDay(iso); return d.getUTCDate() + ' ' + MONTHS[d.getUTCMonth()]; }
  const dayFmt = new Intl.DateTimeFormat('en-CA', { timeZone: 'Europe/Stockholm', year: 'numeric', month: '2-digit', day: '2-digit' });
  const timeFmt = new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/Stockholm', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
  function todayStockholm() { return dayFmt.format(new Date()); }
  function whenText(instant) {
    const t = Date.parse(instant);
    if (!isFinite(t)) return '–';
    const d = new Date(t);
    const day = dayFmt.format(d);
    const time = timeFmt.format(d);
    if (day === todayStockholm()) return 'idag ' + time;
    if (day === addDays(todayStockholm(), -1)) return 'igår ' + time;
    return dayText(day) + ' ' + time;
  }
  function today() {
    const own = todayStockholm();
    const file = str(obj(S.data).today);
    return file && file > own ? file : own;
  }

  /* ---------- Daniels–Gilbert VDOT (display only) ---------- */
  function oxygenCost(v) { return -4.60 + 0.182258 * v + 0.000104 * v * v; }
  function sustainable(min) { return 0.8 + 0.1894393 * Math.exp(-0.012778 * min) + 0.2989558 * Math.exp(-0.1932605 * min); }
  function vdotFromRace(meters, seconds) {
    if (!(meters > 0) || !(seconds >= 210 && seconds <= 21600)) return null;
    const min = seconds / 60;
    return oxygenCost(meters / min) / sustainable(min);
  }
  function raceSeconds(vdot, meters) {
    if (!(vdot > 0) || !(meters > 0)) return null;
    let fast = 210, slow = 21600;
    if (vdot > vdotFromRace(meters, fast) || vdot < vdotFromRace(meters, slow)) return null;
    for (let i = 0; i < 60; i++) { const mid = (fast + slow) / 2; if (vdotFromRace(meters, mid) > vdot) fast = mid; else slow = mid; }
    return (fast + slow) / 2;
  }

  /* ---------- Base64 and crypto ---------- */
  function b64(bytes) { let s = ''; const u = new Uint8Array(bytes); for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); }
  function unb64(text) { const s = atob(text); const u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u; }
  const enc = new TextEncoder();
  const dec = new TextDecoder();
  function random(n) { return crypto.getRandomValues(new Uint8Array(n)); }
  async function deriveKey(password, salt, iterations) {
    const base = await crypto.subtle.importKey('raw', enc.encode(password.normalize('NFC')), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt, iterations }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  }
  function vaultAad(v) { return enc.encode([v.format, v.version, v.kdf, v.iterations, v.salt, v.cipher].join('|')); }
  async function sealVault(password, secret) {
    const salt = random(16);
    const nonce = random(12);
    const v = { format: VAULT_FORMAT, version: 1, kdf: 'PBKDF2-HMAC-SHA256', iterations: ITERATIONS, salt: b64(salt), cipher: 'AES-256-GCM', nonce: b64(nonce) };
    const key = await deriveKey(password, salt, ITERATIONS);
    const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv: nonce, additionalData: vaultAad(v) }, key, enc.encode(JSON.stringify(secret)));
    v.ciphertext = b64(ct);
    return { vault: v, key };
  }
  async function openVault(password, v) {
    if (!v || v.format !== VAULT_FORMAT || v.version !== 1 || v.kdf !== 'PBKDF2-HMAC-SHA256' || v.cipher !== 'AES-256-GCM') throw new Error('format');
    const iterations = Number(v.iterations);
    if (!(iterations >= 100000 && iterations <= 10000000)) throw new Error('format');
    const key = await deriveKey(password, unb64(v.salt), iterations);
    let plain;
    try {
      plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(v.nonce), additionalData: vaultAad(v) }, key, unb64(v.ciphertext));
    } catch (e) { throw new Error('password'); }
    const secret = JSON.parse(dec.decode(plain));
    return { key, secret };
  }
  async function sealWith(key, value, label) {
    const nonce = random(12);
    const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv: nonce, additionalData: enc.encode(label) }, key, enc.encode(JSON.stringify(value)));
    return { nonce: b64(nonce), ciphertext: b64(ct) };
  }
  async function openWith(key, box, label) {
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(box.nonce), additionalData: enc.encode(label) }, key, unb64(box.ciphertext));
    return JSON.parse(dec.decode(plain));
  }

  /* ---------- Storage (this browser only) ---------- */
  function readStore(k) { try { const t = localStorage.getItem(k); return t ? JSON.parse(t) : null; } catch (e) { return null; } }
  function writeStore(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
  function forgetStore() { try { localStorage.removeItem(VAULT_KEY); localStorage.removeItem(STATE_KEY); } catch (e) { /* nothing stored */ } }
  function storageWorks() { try { localStorage.setItem('lopcoach-admin-probe', '1'); localStorage.removeItem('lopcoach-admin-probe'); return true; } catch (e) { return false; } }
  async function saveState() {
    if (!S.key) return;
    const box = await sealWith(S.key, { draft: S.draft, history: S.history.slice(0, 50) }, 'lopcoach-admin-state|1');
    writeStore(STATE_KEY, box);
  }
  async function loadState() {
    const box = readStore(STATE_KEY);
    if (!box || !S.key) return;
    try {
      const v = await openWith(S.key, box, 'lopcoach-admin-state|1');
      S.draft = arr(v.draft).filter((d) => d && d.op && typeof d.op.op === 'string');
      S.history = arr(v.history).filter((h) => h && typeof h.id === 'string');
    } catch (e) { S.draft = []; S.history = []; }
  }

  /* ---------- GitHub contents API ---------- */
  class GhError extends Error { constructor(status, msg) { super(msg); this.status = status; } }
  function contentsPath(path) { return '/repos/' + S.repo.split('/').map(encodeURIComponent).join('/') + '/contents/' + path.split('/').map(encodeURIComponent).join('/'); }
  async function gh(method, path, opts) {
    const o = opts || {};
    const headers = { Authorization: 'Bearer ' + (o.token || S.token), 'X-GitHub-Api-Version': '2022-11-28', Accept: o.raw ? 'application/vnd.github.raw+json' : 'application/vnd.github+json' };
    if (o.body) headers['Content-Type'] = 'application/json';
    let res;
    try {
      res = await fetch(API + path, { method, headers, body: o.body ? JSON.stringify(o.body) : undefined, cache: 'no-store', credentials: 'omit', referrerPolicy: 'no-referrer', redirect: 'error' });
    } catch (e) { throw new GhError(0, 'Kunde inte nå GitHub. Kontrollera nätet och försök igen.'); }
    if (res.status === 404 && o.allow404) return null;
    if (!res.ok) {
      let msg;
      if (res.status === 401) msg = 'GitHub godtar inte nyckeln (401). Den kan ha gått ut eller tagits bort.';
      else if (res.status === 403 && res.headers.get('x-ratelimit-remaining') === '0') msg = 'GitHub begränsar anropen just nu. Vänta en stund.';

    for (const h of S.history) {
      const r = h.result;
      const st = r ? OP_STATUS[r.status] || [String(r.status), 'warning'] : waiting(h) ? ['Väntar på appen', 'info'] : ['Inget svar än', 'warning'];
      const c = el('div', { class: 'card', 'data-command': h.id });
      c.appendChild(el('div', { class: 'row between' }, el('span', { class: 'strong', text: 'Skickat ' + whenText(h.createdAt) }), el('span', { class: 'pill ' + st[1], text: st[0] })));
      if (r) c.appendChild(el('p', { class: 'small muted', style: 'margin:4px 0 8px', text: resultSummary(r) + ' Behandlat ' + whenText(r.processedAt) + '.' }));
      c.appendChild(resultList(h));
      if (!r) c.appendChild(el('button', { class: 'btn text small', type: 'button', text: 'Kolla nu', onclick: () => pollNow(true) }));
      box.appendChild(c);
    }
    s.appendChild(box);
  }

  start();
})();
</script>
</body>
</html>
